# compose.override.yaml – LOCAL builds
#
# Docker Compose auto-loads this file on top of compose.yaml whenever you run
# `docker compose …` from the repository root. It adds the `build:` blocks that the
# production file must not have, so a developer can build the full stack locally:
#
#   docker compose build          # builds db / backend / worker / frontend from local source
#   docker compose up -d          # runs the locally built images
#
# IMPORTANT: This file lives only in the repository. The server has only compose.yaml,
# prod.sh and .env, and prod.sh refuses to run if an override file is present – the
# server always pulls immutable GHCR images and never builds (DEPLOY.md).
#
# Each service keeps the `image:` name from compose.yaml, so `docker compose build`
# tags the locally built image under the same GHCR name and `up` picks it up.
# IMAGE_TAG still needs a value for the tag suffix — set it in .env (any string, e.g. `dev`).

services:
  db:
    build:
      context: docker/db

  backup:
    build:
      context: docker/db

  backend:
    build:
      context: apps/backend
      target: runtime

  worker:
    build:
      context: apps/backend
      target: runtime

  graphhopper:
    build:
      context: docker/graphhopper

  frontend:
    build:
      context: apps/frontend
      target: runtime
      args:
        # Empty string → API calls go to the same origin; nginx proxies /api/ → backend.
        VITE_API_BASE_URL: ""
        REACT_APP_TILE_LAYER_URL: ${REACT_APP_TILE_LAYER_URL:-}
