# The check on every pull request. The job name `Prüfung` is what a required
# status check would reference – not the command name. Branch Protection is not
# enforced on this private repo without a paid plan, so this reports but does
# not block (docs/workflow.md, Ausnahmen).
#
# The job runs `make test` and nothing else: no install steps, no test call of
# its own, no matrix. What runs here is bit-identical to what runs locally. A
# second path would be a second system (docs/workflow.md). The two steps before
# it only give `make test` a buildx builder and GHCR access for its layer cache
# (CACHE_REF, docker-bake.hcl); the master run in release.yml reads the same
# cache, so a merge commit this run already checked passes there in a minute.
# PR runs only read that cache: `packages: read`, so the `cache-to` in
# docker-bake.hcl fails quietly (ignore-error) and only master runs write
# layers that release.yml builds the images from.
name: ci

on:
  pull_request:

jobs:
  pruefung:
    name: Prüfung
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      CACHE_REF: ghcr.io/jonasprade/raildashboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: make test
        run: make test
