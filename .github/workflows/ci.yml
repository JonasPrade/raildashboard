# The check on every pull request. The job name `Prüfung` is what a required
# status check would reference – not the command name. Branch Protection is not
# enforced on this private repo without a paid plan, so this reports but does
# not block (docs/workflow.md, Ausnahmen).
#
# It runs on the self-hosted Hetzner runner `hetzner-dev` (linux/arm64,
# docs/ci-runner-hetzner.md), because GitHub-hosted jobs do not start when the
# Actions budget is spent. That runner executes pull request code, so this job
# gets no secrets and no write rights: read-only token, checkout without stored
# credentials, no GHCR login (hence no registry layer cache: CACHE_REF stays
# empty and `make test` uses the daemon's own cache, docker-bake.hcl), a hard
# time limit and one run per PR. Everything that writes to GHCR or deploys stays
# on GitHub-hosted runners (release.yml, deploy.yml).
#
# The job runs `make test` and nothing else: no install steps, no test call of
# its own, no matrix. What runs here is bit-identical to what runs locally. A
# second path would be a second system (docs/workflow.md).
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pruefung:
    name: Prüfung
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: make test
        run: make test
      # Also after a failure or cancel: the runner is shared with other
      # projects and its disk is small. Only this build cache, never
      # `docker system prune`.
      - name: Build-Cache aufräumen
        if: always()
        run: docker builder prune -f --filter until=168h || true
