# The delivery. Started by hand under Actions -> deploy -> Run workflow.
#
# The button is also the way back: a rollback means entering an earlier SHA.
# There is deliberately no automatic trigger any more – the former tag deploy
# (`on: push: tags: v*`) ran test, build and deploy in one go and took away the
# moment in which someone says "now" (docs/workflow.md).
#
# The button only appears once this file is on master. While it only exists in
# a pull request, it cannot be found.
name: deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit-SHA (leer = aktueller Stand von master). Rollback: frühere SHA eintragen."
        required: false
        default: ""

env:
  IMAGE_PREFIX: ghcr.io/jonasprade/raildashboard
  PROD_URL: https://dashboard.schienengruen.de

jobs:
  deploy:
    name: Auf vmd92747 ausrollen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Record and log, not a gate: Required Reviewers exist on Free/Pro/Team only
    # for public repositories. In a private repo GitHub silently creates the
    # environment without rules. The gate is the dispatch.
    environment: production
    # On the job, not the workflow: at workflow level a quick second merge would
    # kill the running build and the affected commit would lack its images.
    concurrency:
      group: production
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Ziel-SHA bestimmen
        id: ziel
        env:
          # Via the environment, not ${{ }} straight into the script: the input
          # comes from outside and has no business there.
          EINGABE: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          SHA="${EINGABE:-$(git rev-parse HEAD)}"
          if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::'$SHA' ist keine vollständige Commit-SHA (40 Hex-Zeichen)."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Ziel: $SHA"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gibt es die Images überhaupt?
        env:
          SHA: ${{ steps.ziel.outputs.sha }}
        run: |
          set -euo pipefail
          # Before SSH, not after: otherwise a typo would only show on the host.
          for svc in backend frontend db graphhopper; do
            if ! docker manifest inspect "${IMAGE_PREFIX}-${svc}:${SHA}" > /dev/null 2>&1; then
              echo "::error::${IMAGE_PREFIX}-${svc}:${SHA} liegt nicht in GHCR. Ist der release-Lauf zu diesem Commit durch?"
              exit 1
            fi
          done
          echo "Alle vier Images gefunden."

      - name: Ausrollen
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # The key carries a forced command in authorized_keys; what is written
          # here arrives as SSH_ORIGINAL_COMMAND at prod.sh, which extracts the
          # SHA itself and checks it strictly.
          script: /srv/raildashboard/prod.sh ${{ steps.ziel.outputs.sha }}

      # prod.sh only sees the healthcheck inside the container. Whether the site
      # is reachable through the host nginx (TLS, proxy_pass to 127.0.0.1:5000)
      # only a call from outside shows. No rollback from here: the code is
      # healthy, the fault sits in front of it – that needs a human.
      - name: Von außen erreichbar?
        run: |
          set -uo pipefail
          for versuch in 1 2 3 4 5 6; do
            if curl -fsS -m 10 "${PROD_URL}/healthz"; then
              echo
              echo "Erreichbar."
              exit 0
            fi
            sleep 5
          done
          echo "::error::${PROD_URL}/healthz antwortet nicht mit 200. Der Container ist healthy – Host-nginx und Port 127.0.0.1:5000 prüfen."
          exit 1
