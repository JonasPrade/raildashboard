<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Title and description are what the browser sees before the app renders;
         in English they made Chrome detect the page as English and offer a translation. -->
    <meta http-equiv="content-language" content="de" />
    <title>Schienendashboard – Bahnprojekte in Deutschland</title>
    <meta name="description" content="Interaktive Karte und Detailansicht der Schieneninfrastrukturprojekte in Deutschland: Planungsstand, Finanzierung und Abgeordnete je Vorhaben" />
    <meta name="keywords" content="Schiene, Bahn, Eisenbahn, Infrastruktur, Deutschland, Bahnprojekte, Karte" />
    <meta name="theme-color" content="#00373C" />
    <!-- Colour scheme before first paint, so a dark start does not flash paper.
         Same key and values as Mantine's localStorageColorSchemeManager in main.tsx
         ("light" | "dark" | "auto"; missing = auto = system setting). -->
    <script>
      (function () {
        var stored = null;
        try { stored = window.localStorage.getItem("schienendashboard.thema"); } catch (e) {}
        var scheme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-mantine-color-scheme", scheme);
        document.documentElement.setAttribute("data-theme", scheme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
