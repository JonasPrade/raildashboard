<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Title and description are what the browser sees before the app renders;
         in English they made Chrome detect the page as English and offer a translation. -->
    <meta http-equiv="content-language" content="de" />
    <title>Schienendashboard – Bahnprojekte in Deutschland</title>
    <meta name="description" content="Interaktive Karte und Detailansicht der Schieneninfrastrukturprojekte in Deutschland: Planungsstand, Finanzierung und Abgeordnete je Vorhaben" />
    <meta name="keywords" content="Schiene, Bahn, Eisenbahn, Infrastruktur, Deutschland, Bahnprojekte, Karte" />
    <meta name="theme-color" content="#0d1013" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Web fonts load without blocking the first paint (display=swap shows the
         fallback font until they arrive). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
